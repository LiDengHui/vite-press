# ============================================================
# 与线上服务端 nginx 配置保持一致（线上为 Debian 系 nginx）
#
# 容器内与线上的差异只有这几处，其余逐行对齐：
#   1. 站点目录 /root/blog/ 与线上相同，由 Dockerfile 把构建产物拷进去
#   2. 443 证书用构建时生成的自签证书，文件名与线上一致
#      （/root/ssl/pinia.work_bundle.crt / pinia.work.key）
#   3. /etc/nginx/modules.conf 由 Dockerfile 建空文件，线上这台是自己加的
#   4. api / socket.io / peerjs 仍指向 127.0.0.1:9000，
#      容器内没有该后端，这些路径会返回 502（线上后端正常时才有响应）
# ============================================================

user root;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;
include /etc/nginx/modules.conf;

events {
    worker_connections 768;
    # multi_accept on;
}

http {

    ##
    # Basic Settings
    ##

    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    # server_tokens off;

    # server_names_hash_bucket_size 64;
    # server_name_in_redirect off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # SSL Settings
    ##

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
    ssl_prefer_server_ciphers on;

    ##
    # Logging Settings
    ##

    access_log /var/log/nginx/access.log;

    ##
    # Brotli
    ##

    brotli on;
    brotli_static on;
    brotli_comp_level 6;
    brotli_buffers 16 8k;
    brotli_min_length 20;
    brotli_types text/plain text/css text/javascript text/xml application/javascript application/x-javascript application/json application/xml application/rss+xml application/atom+xml application/wasm application/x-httpd-php image/svg+xml image/webp image/png image/jpeg image/jpg image/gif image/avif image/x-icon font/ttf font/otf font/woff font/woff2 application/font-woff application/font-woff2 application/octet-stream;

    ##
    # Gzip Settings
    ##

    gzip on;

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css text/javascript text/xml application/javascript application/x-javascript application/json application/xml application/rss+xml application/atom+xml application/wasm application/x-httpd-php image/svg+xml image/webp image/png image/jpeg image/jpg image/gif image/avif image/x-icon font/ttf font/otf font/woff font/woff2 application/font-woff application/font-woff2 application/octet-stream;

    ##
    # Virtual Host Configs
    ##

    # include /etc/nginx/conf.d/*.conf;
    # include /etc/nginx/sites-enabled/*;

    server {
        listen       80;
        server_name  www.pinia.work;
        index  index.php index.html;

        location / {
            root   /root/blog/;
            index  index.html;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location ^~/api/ {
            proxy_pass  http://127.0.0.1:9000; # 转发规则

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            rewrite ^/api/(.*)$ /$1 break;
        }

        location /socket.io/ {
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /static {
            root /root/;
            add_header Cache-Control no-cache;
        }

        location /admin {
            root /root/;
            add_header Cache-Control no-cache;
        }

        location /tool {
            root /root/;
            add_header Cache-Control no-cache;
        }

        location /uploads {
            root /root/;
            add_header Cache-Control no-cache;
        }

        location /peerjs {
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # include include/*.conf;

    server {
        listen       443 ssl;
        server_name  pinia.work;
        index  index.php index.html;

        # SSL
        ssl_certificate      /root/ssl/pinia.work_bundle.crt;
        ssl_certificate_key  /root/ssl/pinia.work.key;
        ssl_session_timeout 20m;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_prefer_server_ciphers on;
        ssl_verify_client off;

        location / {
            root   /root/blog/;
            index  index.html;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location ^~/api/ {
            proxy_pass  http://127.0.0.1:9000; # 转发规则

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            rewrite ^/api/(.*)$ /$1 break;
        }

        location /socket.io/ {
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /static {
            root /root/;
            add_header Cache-Control no-cache;
        }

        location /admin {
            root /root/;
            add_header Cache-Control no-cache;
        }

        location /tool {
            root /root/;
            add_header Cache-Control no-cache;
        }

        location /uploads {
            root /root/;
            add_header Cache-Control no-cache;
        }

        location /peerjs {
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
